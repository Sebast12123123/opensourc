<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoMeAlcanza</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <h1><i class="fas fa-wallet"></i> NoMeAlcanza ;-;</h1>
                <div class="theme-switch">
                    <span class="theme-icon"><i class="fas fa-sun"></i></span>
                    <label class="switch">
                        <input type="checkbox" id="theme-toggle">
                        <span class="slider round"></span>
                    </label>
                    <span class="theme-icon"><i class="fas fa-moon"></i></span>
                </div>
            </div>
        </header>

        <main class="app-main">
            <section class="balance-section">
                <div class="balance-card">
                    <div class="balance-info">
                        <h3>Tu balance</h3>
                        <h2 id="balance">$0.00</h2>
                    </div>
                    <div class="balance-icon">
                        <i class="fas fa-chart-line"></i>
                    </div>
                </div>
            </section>
<section class="goal-section">
    <div class="goal-container">

        <div class="goal-header">
            <h3><i class="fas fa-bullseye"></i> Meta de ahorro</h3>
        </div>

        <div class="goal-form">

            <div class="form-group">
                <label for="goal-name">Nombre de la meta</label>
                <input 
                    type="text" 
                    id="goal-name" 
                    placeholder="Ej: Viaje a Cartagena"
                >
            </div>

            <div class="form-group">
                <label for="goal-amount">Monto objetivo</label>

                <div class="input-with-icon">
                    <span class="input-icon">$</span>

                    <input 
                        type="number" 
                        id="goal-amount" 
                        placeholder="0.00"
                    >
                </div>
            </div>

            <button class="btn primary-btn" id="save-goal-btn">
                <i class="fas fa-save"></i> Guardar meta
            </button>

        </div>

        <div class="goal-progress-card">

            <div class="goal-info">
                <h4 id="goal-title">Sin meta definida</h4>

                <p class="goal-progress-text">
                    <span id="saved-amount">$0</span>
                    /
                    <span id="goal-total">$0</span>
                </p>

                <p class="goal-remaining">
                    Te faltan:
                    <span id="remaining-amount">$0</span>
                </p>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>

            <p class="progress-percentage" id="progress-percentage">
                0% completado
            </p>

        </div>

    </div>
</section>

<section class="charts-section">

    <div class="charts-container">

        <div class="chart-card">

            <div class="chart-header">
                <h3>Gastos por categoría</h3>

                <button class="zoom-btn"
                        onclick="openChartModal('expenseChart')">
                    🔍
                </button>
            </div>

            <canvas id="expenseChart"></canvas>

        </div>

        <div class="chart-card">

            <div class="chart-header">
                <h3>Historial del balance</h3>

                <button class="zoom-btn"
                        onclick="openChartModal('balanceLineChart')">
                    🔍
                </button>
            </div>

            <canvas id="balanceLineChart"></canvas>

        </div>

    </div>

</section>



            

            <section class="summary-section">
                <div class="summary-grid">
                    <div class="summary-card income-card">
                        <div class="summary-icon">
                            <i class="fas fa-arrow-down"></i>
                        </div>
                        <div class="summary-details">
                            <h4>Ingreso</h4>
                            <p id="income-total">$0.00</p>
                        </div>
                    </div>
                    <div class="summary-card expense-card">
                        <div class="summary-icon">
                            <i class="fas fa-arrow-up"></i>
                        </div>
                        <div class="summary-details">
                            <h4>Gasto</h4>
                            <p id="expense-total">$0.00</p>
                        </div>
                    </div>
                </div>
            </section>

            <section class="form-section">
                <div class="form-container">
                    <h3><i class="fas fa-plus-circle"></i> Añadir transaccion</h3>
                    <form id="form">
                        <div class="form-group">
                            <label for="type">Tipo</label>
                            <div class="select-wrapper">
                                <select id="type" required>
                                    <option value="income">Ingreso</option>
                                    <option value="expense">Gasto</option>
                                </select>
                                <i class="fas fa-chevron-down"></i>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="description">Descripcion</label>
                            <input type="text" id="description" placeholder="Ingresa la descripcion..." required>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="amount">Monto</label>
                                <div class="input-with-icon">
                                    <span class="input-icon">$</span>
                                    <input type="number" id="amount" placeholder="0.00" required>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="date">Fecha</label>
                                <div class="input-with-icon">
                                    <span class="input-icon"><i class="far fa-calendar"></i></span>
                                    <input type="date" id="date" required>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="category">Categoria</label>
                            <div class="select-wrapper">
                                <select id="category" required>
                                    <option value="">Selecciona la categoria</option>
                                    <option value="Salario">Salario</option>
                                    <option value="Independiente">Independiente</option>
                                    <option value="Inversion">Inversion</option>
                                    <option value="Comida">Comida</option>
                                    <option value="Transporte">Transporte</option>
                                    <option value="Entretenimiento">Entretenimiento</option>
                                    <option value="Utilidades">Utilidades</option>
                                    <option value="Compras">Compras</option>
                                    <option value="Otros">Otros</option>
                                </select>
                                <i class="fas fa-chevron-down"></i>
                            </div>
                        </div>
                        <button type="submit" class="btn primary-btn">
                            <i class="fas fa-plus"></i> Añadir transaccion
                        </button>
                    </form>
                </div>
            </section>

            <section class="transactions-section">
                <div class="transactions-header">
                    <h3><i class="fas fa-history"></i> Historial de transacciones</h3>
                    <div class="filter-controls">
                        <div class="filter-group">
                            <div class="select-wrapper small">
                                <select id="filter-type">
                                    <option value="all">Todos los tipos</option>
                                    <option value="income">Ingreso</option>
                                    <option value="expense">Gasto</option>
                                </select>
                                <i class="fas fa-chevron-down"></i>
                            </div>
                        </div>
                        <div class="filter-group">
                            <div class="select-wrapper small">
                                <select id="filter-category">
                                    <option value="all">Todas las categorias</option>
                                    <option value="Salario">Salario</option>
                                    <option value="Independiente">Independiente</option>
                                    <option value="Inversion">Inversion</option>
                                    <option value="Comida">Comida</option>
                                    <option value="Transporte">Transporte</option>
                                    <option value="Entretenimiento">Entretenimiento</option>
                                    <option value="Utilidades">Utilidades</option>
                                    <option value="Compras">Compras</option>
                                    <option value="Otros">Otros</option>
                                </select>
                                <i class="fas fa-chevron-down"></i>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="transactions-container">
                    <ul id="transactions"></ul>
                </div>
            </section>
        </main>
        <div id="chartModal" class="chart-modal">

    <div class="chart-modal-content">

        <span class="close-modal"
              onclick="closeChartModal()">
            &times;
        </span>

        <canvas id="zoomChart"></canvas>

    </div>

</div>

        <footer class="app-footer">
            <p>© 2026 NoMeAlcanza | Sobreviviendo economicamente <i class="fas fa-heart"></i></p>
        </footer>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
